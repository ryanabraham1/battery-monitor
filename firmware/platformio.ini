; FRC battery IR monitor node - ESP32-S3-WROOM-1-N8, native USB (GPIO19/20)
; Build + flash:  pio run -t upload      Serial console:  pio device monitor
[env:ir_node]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
